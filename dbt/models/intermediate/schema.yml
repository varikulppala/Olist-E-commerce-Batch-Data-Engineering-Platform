version: 2

models:
  - name: int_orders_enriched
    description: "Order-level intermediate model enriched with customer attributes."
    columns:
      - name: order_id
        description: "Unique identifier for an order."
        data_tests:
          - not_null
          - unique

      - name: customer_id
        description: "Customer identifier associated with the order."
        data_tests:
          - not_null

  - name: int_order_items_enriched
    description: "Order-item level model enriched with product, category and seller attributes."
    columns:
      - name: order_id
        description: "Order identifier."
        data_tests:
          - not_null

      - name: order_item_id
        description: "Sequential item identifier within an order."
        data_tests:
          - not_null

      - name: product_id
        description: "Product identifier."
        data_tests:
          - not_null

      - name: seller_id
        description: "Seller identifier."
        data_tests:
          - not_null

  - name: int_products_enriched
    description: "Product-level intermediate model enriched with English category."
    columns:
      - name: product_id
        description: "Unique product identifier."
        data_tests:
          - not_null
          - unique

  - name: int_customer_orders
    description: "Customer-level order metrics aggregated from orders, order items and payments."
    columns:
      - name: customer_id
        description: "Customer identifier."
        data_tests:
          - not_null
          - unique

      - name: customer_unique_id
        description: "Persistent customer identifier."
        data_tests:
          - not_null
