version: 2

models:
  - name: dim_customers
    description: "Customer dimension containing customer identity and geographic attributes."
    columns:
      - name: customer_id
        description: "Customer identifier."
        data_tests:
          - not_null
          - unique

      - name: customer_unique_id
        description: "Persistent customer identifier."
        data_tests:
          - not_null

  - name: dim_products
    description: "Product dimension enriched with translated product categories."
    columns:
      - name: product_id
        description: "Unique product identifier."
        data_tests:
          - not_null
          - unique

  - name: dim_sellers
    description: "Seller dimension containing seller geographic attributes."
    columns:
      - name: seller_id
        description: "Unique seller identifier."
        data_tests:
          - not_null
          - unique

  - name: fact_orders
    description: "Order-level analytical fact containing order status, timestamps and financial metrics."
    columns:
      - name: order_id
        description: "Unique order identifier."
        data_tests:
          - not_null
          - unique

      - name: customer_id
        description: "Customer associated with the order."
        data_tests:
          - not_null

  - name: fact_order_items
    description: "Order-item level analytical fact containing product, seller and financial information."
    columns:
      - name: order_id
        description: "Order identifier."
        data_tests:
          - not_null

      - name: order_item_id
        description: "Sequential item identifier within an order."
        data_tests:
          - not_null

      - name: product_id
        description: "Product identifier."
        data_tests:
          - not_null

      - name: seller_id
        description: "Seller identifier."
        data_tests:
          - not_null
